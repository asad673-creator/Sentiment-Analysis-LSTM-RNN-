<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sentiment Analysis</h1>

    <form method="POST">

        <textarea
            name="text"
            placeholder="Enter your text..."
            required
        >{{ text }}</textarea>

        <br>

        <button type="submit">Analyze Sentiment</button>

    </form>

    {% if sentiment %}
        <div class="result">
            Sentiment: {{ sentiment }}
        </div>
    {% endif %}

</div>

</body>
</html>
